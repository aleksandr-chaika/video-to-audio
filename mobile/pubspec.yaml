name: mp3craft
description: "MP3 Craft — convert audio/video to WAV"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  audio_waveforms: ^2.0.2
  bloc: ^9.2.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.2
  equatable: ^2.0.7
  # ffmpeg_kit_flutter_* пакеты не имеют simulator-slice → собираем без них.
  # На реальном устройстве: вернуть ffmpeg_kit_flutter_new и реальные импорты в
  #   lib/features/convert/data/datasources/ffmpeg_local_ds.dart
  #   lib/features/crop/data/datasources/ffmpeg_crop_ds.dart
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^2.4.4
  google_fonts: ^6.2.1
  get_it: ^8.0.3
  go_router: ^17.2.2
  image_picker: ^1.1.2
  injectable: ^2.5.0
  intl: any
  json_annotation: ^4.9.0
  just_audio: ^0.10.5
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  share_plus: ^10.1.4
  sqflite: ^2.4.2+1

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  injectable_generator: ^2.7.0
  json_serializable: ^6.9.0
  mocktail: ^1.0.5

# Type-safe assets через lib/gen/assets.gen.dart (совместим по API
# с flutter_gen). Использование: Assets.images.icons.icGallery.path
# или Assets.images.youtubeLogo.image(width: 20).
# При добавлении новых файлов в assets/images/** — добавить вручную
# в lib/gen/assets.gen.dart (структура зеркалит файловую систему).

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    # Flutter НЕ включает подпапки рекурсивно — icons/ нужен явно,
    # иначе ic_gallery / ic_files / ic_clipboard и др. не попадут в bundle.
    - assets/images/icons/
